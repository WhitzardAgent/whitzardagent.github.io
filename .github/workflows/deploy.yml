name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate content contracts
        env:
          NUWA_SNAPSHOT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: npm test && npm run check:nuwa-index && npm run check:nuwa-publication && npm run check:terminology && npm run check:research-blog && npm run check

      - name: Build site
        run: npm run build

      - name: Validate rendered site
        run: npm run check:content && npm run check:links && node scripts/check-nuwa-source-output.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
